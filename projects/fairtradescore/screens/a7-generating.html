<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generating score</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}@keyframes dc-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 22px 26px; background: #0B0D10; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; gap: 24px; overflow: hidden; font-variant-numeric: tabular-nums">

<div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 30px 0 10px; background: radial-gradient(60% 70% at 50% 60%, rgba(167,139,250,0.30) 0%, rgba(11,13,16,0) 72%)">
<svg width="260" height="146" viewBox="0 0 260 146" fill="none" role="img" aria-label="Progress dial"><path d="M 16 134 A 114 114 0 0 1 244 134" stroke="#22262D" stroke-width="12" stroke-linecap="round"></path><path d="M 16 134 A 114 114 0 0 1 244 134" pathLength="100" stroke-dasharray="{{dash}}" stroke="#A78BFA" stroke-width="12" stroke-linecap="round" style="transition: stroke-dasharray 0.8s ease"></path></svg>
<div style="position: absolute; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center"><span style="font-size: 48px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">{{percentLabel}}</span><span style="font-size: 13px; font-weight: 600; color: #A1A9B5">{{dialCaption}}</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; font-weight: 500; color: #A1A9B5">{{subtitle}}</p>
</div>

<section style="display: flex; flex-direction: column; padding: 6px 18px; border-radius: 24px; background: #171A1F; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 24px rgba(0,0,0,0.45)" aria-live="polite">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; min-height: 56px">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><span style="width: 28px; height: 28px; border-radius: 999px; background: rgba(45,212,191,0.16); display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
<sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}"><span style="width: 28px; height: 28px; border-radius: 999px; border: 3px solid #A78BFA; border-right-color: transparent; box-sizing: border-box; flex: none; animation: dc-spin 0.9s linear infinite"></span></sc-if>
<sc-if value="{{s.pending}}" hint-placeholder-val="{{ false }}"><span style="width: 28px; height: 28px; border-radius: 999px; border: 2px solid #2A2F37; box-sizing: border-box; flex: none"></span></sc-if>
<span style="font-size: 15px; font-weight: {{s.weight}}; color: {{s.color}}">{{s.label}}</span>
</div>
</sc-for>
</section>

<div style="margin-top: auto">
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="b0-building.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #A78BFA; box-shadow: 0 8px 28px rgba(167,139,250,0.35); color: #0B0D10; font-size: 16px; font-weight: 800; text-decoration: none">Go to my profile</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 20px; background: #171A1F; font-size: 13px; line-height: 1.45; font-weight: 500; color: #A1A9B5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A9B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span>Usually under a minute. You can close the app; we’ll send a notification when it’s ready.</span></div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => {
const next = Math.min(4, (this.state && this.state.step ? this.state.step : 0) + 1);
this.setState({ step: next });
if (next >= 4) { clearInterval(this.timer); }
}, 1100);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const step = (this.state && this.state.step) ? this.state.step : 0;
const labels = ['Business verified', '12 months of statements read', 'Reading cash-flow patterns', 'Setting up your trust profile'];
const steps = labels.map((label, i) => {
const done = i < step;
const active = i === step;
return {
label: label,
done: done,
active: active,
pending: i > step,
weight: active ? '800' : '600',
color: i > step ? '#6E7684' : '#F3F5F8'
};
});
const pct = Math.round(Math.max(step, 0.4) * 25);
const ready = step >= 4;
return {
steps: steps,
dash: pct + ' 100',
percentLabel: ready ? 'Done' : pct + '%',
dialCaption: ready ? 'Profile verified' : 'Working on it',
title: ready ? 'Your profile is verified' : 'Setting up your profile',
subtitle: ready ? 'Your score builds as suppliers verify your credits. Add past credits to get it sooner.' : 'Reading your statements securely. Nothing leaves your control.',
ready: ready,
notReady: !ready
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
