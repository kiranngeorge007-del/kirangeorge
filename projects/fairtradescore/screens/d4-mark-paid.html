<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark as paid</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #050608; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; font-variant-numeric: tabular-nums">

<div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 26px; opacity: 0.28; font-size: 17px; font-weight: 800">Ravi Distributors · RD-4471</div>

<div role="dialog" aria-label="Mark as paid" style="position: relative; background: #171A1F; border-top: 1px solid rgba(255,255,255,0.08); box-shadow: 0 -20px 50px rgba(0,0,0,0.6); border-radius: 32px 32px 0 0; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3A3F48"></span>

<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Mark as paid</span><span style="font-size: 13px; color: #A1A9B5">Ravi Distributors · ₹21,500 left</span></div>

<div role="radiogroup" aria-label="How much" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0D10">
<button type="button" role="radio" aria-checked="{{isFull}}" onClick="{{pickFull}}" style="min-height: 44px; border: none; border-radius: 999px; background: {{bgFull}}; color: {{cFull}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700">Full · ₹21,500</button>
<button type="button" role="radio" aria-checked="{{isPart}}" onClick="{{pickPart}}" style="min-height: 44px; border: none; border-radius: 999px; background: {{bgPart}}; color: {{cPart}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700">Part payment</button>
</div>
<sc-if value="{{part}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="hf-part-amt" style="font-size: 13px; font-weight: 600; color: #A1A9B5">Amount paid</label><input id="hf-part-amt" value="₹10,000" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: #0B0D10; border: 2px solid #A78BFA; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800"><span style="font-size: 12px; color: #A1A9B5">₹11,500 will stay open, still due 2 Dec</span></div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #A1A9B5">How did you pay?</span>
<div role="radiogroup" aria-label="Payment method" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: {{m.border}}; background: {{m.bg}}; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="hf-ref" style="font-size: 13px; font-weight: 600; color: #A1A9B5">{{refLabel}}</label><input id="hf-ref" placeholder="{{refHint}}" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: #0B0D10; border: 1px solid #2A2F37; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600"></div>

<button type="button" onClick="{{attach}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px dashed rgba(167,139,250,0.5); background: rgba(167,139,250,0.06); color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg>{{attachLabel}}</button>

<button type="button" onClick="{{submit}}" style="min-height: 56px; border: none; border-radius: 999px; background: #A78BFA; box-shadow: 0 8px 28px rgba(167,139,250,0.35); color: #0B0D10; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 800">Send to Ravi to confirm</button>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="width: 56px; height: 56px; border-radius: 999px; background: rgba(251,191,36,0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
<span style="font-size: 22px; line-height: 1.2; font-weight: 800">Waiting for Ravi to confirm</span>
<span style="font-size: 14px; line-height: 1.55; color: #A1A9B5">{{doneBody}}</span>
<a href="d2-credit.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #A78BFA; color: #0B0D10; font-size: 16px; font-weight: 800; text-decoration: none">Back to credit</a>
</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const part = !!s.part;
const method = s.method || 'upi';
const defs = [['upi', 'UPI', 'UPI reference number', '12-digit number from your UPI app'], ['bank', 'Bank transfer', 'UTR number', 'From your bank SMS'], ['cash', 'Cash', 'Receipt number (optional)', 'If Ravi gave you a receipt'], ['cheque', 'Cheque', 'Cheque number', '6-digit number']];
const cur = defs.find(d => d[0] === method);
const on = '#2A2F37';
return {
editing: !s.done, done: !!s.done,
part: part,
isFull: part ? 'false' : 'true', isPart: part ? 'true' : 'false',
bgFull: part ? 'transparent' : on, cFull: part ? '#A1A9B5' : '#F3F5F8',
bgPart: part ? on : 'transparent', cPart: part ? '#F3F5F8' : '#A1A9B5',
pickFull: () => this.setState({ part: false }),
pickPart: () => this.setState({ part: true }),
methods: defs.map(d => ({ label: d[1], checked: d[0] === method ? 'true' : 'false', bg: d[0] === method ? 'rgba(167,139,250,0.18)' : '#22262D', border: d[0] === method ? '1px solid #A78BFA' : '1px solid rgba(255,255,255,0.08)', pick: () => this.setState({ method: d[0] }) })),
refLabel: cur[2], refHint: cur[3],
attachLabel: s.attached ? 'Screenshot attached ✓' : 'Attach a screenshot (optional)',
attach: () => this.setState({ attached: true }),
doneBody: method === 'cash' ? 'Cash leaves no bank record, so Ravi’s confirmation matters. They have 7 days; after that it counts as unconfirmed.' : 'Ravi has 7 days to confirm. If your bank data shows this transfer first, we’ll confirm it automatically.',
submit: () => this.setState({ done: true })
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
