<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Help and support</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 18px 24px; background: #0B0D10; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="e1-account.html" aria-label="Back to Account" style="width: 44px; height: 44px; border-radius: 999px; background: #22262D; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex: 1; font-size: 17px; font-weight: 800">Help &amp; support</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{chat}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 24px; border: 1px solid rgba(167,139,250,0.35); background: #171A1F; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; text-align: left"><span style="width: 40px; height: 40px; border-radius: 14px; background: rgba(167,139,250,0.18); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path></svg></span><span style="font-size: 15px; font-weight: 800">Chat with us</span><span style="font-size: 12px; color: #A1A9B5">Replies in about 5 min</span></button>
<button type="button" onClick="{{call}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.06); background: #171A1F; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; text-align: left"><span style="width: 40px; height: 40px; border-radius: 14px; background: #22262D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></span><span style="font-size: 15px; font-weight: 800">Call us</span><span style="font-size: 12px; color: #A1A9B5">9 am – 7 pm, Mon–Sat</span></button>
</div>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 12px 16px; border-radius: 16px; background: #22262D; font-size: 13px; font-weight: 600">{{toast}}</div>
</sc-if>

<span style="font-size: 13px; font-weight: 700; color: #A1A9B5">Common questions</span>
<div style="display: flex; flex-direction: column; padding: 4px 16px; border-radius: 20px; background: #171A1F; flex: 1; min-height: 0; overflow: hidden">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
<div style="border-bottom: 1px solid #22262D">
<button type="button" aria-expanded="{{f.expanded}}" onClick="{{f.toggle}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 54px; border: none; background: transparent; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; text-align: left"><span style="flex: 1">{{f.q}}</span><span style="font-size: 18px; color: #A1A9B5">{{f.icon}}</span></button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 14px; font-size: 13px; line-height: 1.55; color: #A1A9B5">{{f.a}}</p></sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 20px; background: #171A1F; font-size: 12px; line-height: 1.5; color: #A1A9B5">
<span style="font-size: 13px; font-weight: 800; color: #F3F5F8">Grievance officer</span>
<span>Meera Iyer, Grievance officer · grievance@fairtradescore.in · replies within 30 days</span>
<span><a href="l1-terms.html">Terms</a> · <a href="l2-privacy.html">Privacy policy</a></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const open = s.open === undefined ? 0 : s.open;
const data = [
['Why did my score change?', 'Scores update on the 1st of each month. Open “See why” on your home screen to see which factor moved and the payments behind it.'],
['Can a supplier see my bank statements?', 'Never. Suppliers only see your score, band, confidence and a factor summary, and only after you approve.'],
['Is this my CIBIL score?', 'No. It’s a separate trade score and doesn’t affect your CIBIL score.'],
['How do I fix a wrong payment?', 'Go to Payment behaviour or Trade payments and tap “Dispute a payment”. We check with the supplier within 7 days.']
];
return {
faqs: data.map((d, i) => ({ q: d[0], a: d[1], open: i === open, expanded: i === open ? 'true' : 'false', icon: i === open ? '−' : '+', toggle: () => this.setState({ open: i === open ? -1 : i }) })),
hasToast: !!s.toast, toast: s.toast || '',
chat: () => this.setState({ toast: 'Connecting you to an agent… you’re number 2 in line.' }),
call: () => this.setState({ toast: 'Calling +91 98765 43210…' })
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
