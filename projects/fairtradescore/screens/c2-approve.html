<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approve request</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #050608; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.28"><span style="align-self: flex-start; font-size: 17px; font-weight: 800">Suresh General Store</span><span style="font-size: 64px; line-height: 1; font-weight: 800; margin-top: 30px">{{bgBig}}</span></div>

<div role="dialog" aria-label="Access request from Ravi Distributors" style="position: relative; background: #171A1F; border-top: 1px solid rgba(255,255,255,0.08); box-shadow: 0 -20px 50px rgba(0,0,0,0.6); border-radius: 32px 32px 0 0; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3A3F48"></span>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 999px; background: rgba(167,139,250,0.2); color: #C4B5FD; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">RD</span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Ravi Distributors</span><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #A1A9B5">FMCG distributor · Nashik<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="verified"><path d="M5 12l5 5 9-10"></path></svg></span></div></div>
<span style="font-size: 23px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">{{title}}</span>
<sc-if value="{{showStageNote}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; line-height: 1.45; color: #A1A9B5">{{stageNote}}</span></sc-if>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 22px; background: #22262D; border: 1px solid rgba(255,255,255,0.06); font-size: 14px; font-weight: 600">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A9B5">They will see</span>
<sc-for list="{{sees}}" as="x" hint-placeholder-count="3">
<span style="display: flex; gap: 10px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{x.text}}</span>
</sc-for>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A9B5; margin-top: 4px">They will never see</span>
<span style="display: flex; gap: 10px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Bank statements or balances</span>
<span style="display: flex; gap: 10px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Your other suppliers</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div role="radiogroup" aria-label="Access duration" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0D10">
<button type="button" role="radio" aria-checked="{{is30}}" onClick="{{pick30}}" style="min-height: 44px; border: {{border30}}; border-radius: 999px; background: {{bg30}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; color: {{color30}}">30 days</button>
<button type="button" role="radio" aria-checked="{{is90}}" onClick="{{pick90}}" style="min-height: 44px; border: {{border90}}; border-radius: 999px; background: {{bg90}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; color: {{color90}}">90 days</button>
</div>
<span style="font-size: 12px; color: #A1A9B5">Access ends on {{endDate}}. {{autoUpdate}}</span>
</div>
<a href="c1-trust.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #A78BFA; box-shadow: 0 8px 28px rgba(167,139,250,0.35); color: #0B0D10; font-size: 16px; font-weight: 800; text-decoration: none">Approve for {{days}} days</a>
<a href="c1-trust.html" style="display: flex; align-items: center; justify-content: center; min-height: 40px; color: #F3F5F8; font-size: 15px; font-weight: 700; text-decoration: none">Decline</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","default":"building","options":["building","early","established"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const stage = this.props.stage ?? 'building';
const days = (this.state && this.state.days) ? this.state.days : 90;
const on = { border: '1px solid rgba(255,255,255,0.1)', bg: '#2A2F37', color: '#F3F5F8' };
const off = { border: 'none', bg: 'transparent', color: '#A1A9B5' };
const a = days === 30 ? on : off;
const b = days === 90 ? on : off;
const copy = {
building: {
title: 'wants to see your trust profile',
note: 'You don’t have a score yet. They’ll see facts we’ve verified, and your score when it unlocks.',
sees: ['Verified business details', 'Business snapshot · cash flow and bounces', 'Your verified credits so far · 2', 'Progress to your first score'],
big: '2/3'
},
early: {
title: 'wants to see your early trust score',
note: 'It’s shown as a range, labelled “Early”, so they know it’s still settling.',
sees: ['Early score range · 62–74', 'Your verified credits · 3', 'Business snapshot'],
big: '62–74'
},
established: {
title: 'wants to see your trade trust score',
note: '',
sees: ['Score, band and confidence · 72 Good', 'Summary of the five factors'],
big: '72'
}
}[stage] || {};
return {
title: copy.title,
stageNote: copy.note,
showStageNote: !!copy.note,
sees: (copy.sees || []).map(t => ({ text: t })),
bgBig: copy.big,
autoUpdate: stage === 'established' ? 'You can stop it any time from Trust.' : 'Updates as your score builds. Stop any time from Trust.',
days: days,
endDate: days === 30 ? '24 Dec 2026' : '22 Feb 2027',
is30: days === 30 ? 'true' : 'false',
is90: days === 90 ? 'true' : 'false',
border30: a.border, bg30: a.bg, color30: a.color,
border90: b.border, bg90: b.bg, color90: b.color,
pick30: () => this.setState({ days: 30 }),
pick90: () => this.setState({ days: 90 })
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
