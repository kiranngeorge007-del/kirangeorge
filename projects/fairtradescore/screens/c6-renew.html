<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Renew access</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #050608; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 28px; display: flex; flex-direction: column; gap: 14px; opacity: 0.28"><span style="font-size: 28px; font-weight: 800">Trust &amp; privacy</span><div style="height: 76px; border-radius: 24px; background: #171A1F"></div><div style="height: 160px; border-radius: 24px; background: #171A1F"></div></div>

<div role="dialog" aria-label="Renew access for Mehta Wholesale" style="position: relative; background: #171A1F; border-top: 1px solid rgba(255,255,255,0.08); box-shadow: 0 -20px 50px rgba(0,0,0,0.6); border-radius: 32px 32px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3A3F48"></span>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 999px; background: #2A2F37; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">MW</span><div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Mehta Wholesale</span><span style="font-size: 12px; font-weight: 700; color: #FBBF24">Access ends in 6 days · 30 Nov</span></div></div>
<span style="font-size: 23px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">Keep sharing with Mehta Wholesale?</span>
<span style="font-size: 14px; line-height: 1.55; color: #A1A9B5">They’ll keep seeing the same things as now: your score, band, confidence and factor summary.</span>
<div role="radiogroup" aria-label="Renew for" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0D10">
<button type="button" role="radio" aria-checked="{{is30}}" onClick="{{pick30}}" style="min-height: 44px; border: none; border-radius: 999px; background: {{bg30}}; color: {{c30}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700">30 days</button>
<button type="button" role="radio" aria-checked="{{is90}}" onClick="{{pick90}}" style="min-height: 44px; border: none; border-radius: 999px; background: {{bg90}}; color: {{c90}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700">90 days</button>
</div>
<span style="font-size: 12px; color: #A1A9B5">New end date: {{endDate}}</span>
<a href="c1-trust.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #A78BFA; box-shadow: 0 8px 28px rgba(167,139,250,0.35); color: #0B0D10; font-size: 16px; font-weight: 800; text-decoration: none">Renew for {{days}} days</a>
<a href="c1-trust.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #F3F5F8; font-size: 15px; font-weight: 700; text-decoration: none">Let it expire</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = (this.state && this.state.days) || 30;
return {
days: d,
endDate: d === 30 ? '30 Dec 2026' : '28 Feb 2027',
is30: d === 30 ? 'true' : 'false', is90: d === 90 ? 'true' : 'false',
bg30: d === 30 ? '#2A2F37' : 'transparent', c30: d === 30 ? '#F3F5F8' : '#A1A9B5',
bg90: d === 90 ? '#2A2F37' : 'transparent', c90: d === 90 ? '#F3F5F8' : '#A1A9B5',
pick30: () => this.setState({ days: 30 }),
pick90: () => this.setState({ days: 90 })
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
