<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Access log</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 18px 24px; background: #0B0D10; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="c1-trust.html" aria-label="Back to Trust" style="width: 44px; height: 44px; border-radius: 999px; background: #22262D; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex: 1; font-size: 17px; font-weight: 800">Access log</span>
</div>

<p style="margin: 0; font-size: 14px; line-height: 1.5; font-weight: 500; color: #A1A9B5">Every time someone views your score, or you change who can, it’s recorded here.</p>

<div style="display: flex; gap: 8px" role="tablist" aria-label="Filter">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: {{t.color}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 800">{{t.label}}</button>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; padding: 4px 18px; border-radius: 24px; background: #171A1F; border: 1px solid rgba(255,255,255,0.06); flex: 1; min-height: 0; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; gap: 14px; padding: 13px 0; border-bottom: 1px solid #22262D">
<span style="width: 36px; height: 36px; border-radius: 999px; background: {{r.iconBg}}; color: {{r.iconColor}}; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">{{r.icon}}</span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 1.4"><b>{{r.who}}</b> {{r.what}}</span><span style="font-size: 12px; color: #A1A9B5">{{r.when}}</span></div>
</div>
</sc-for>
<span style="padding: 14px 0; text-align: center; font-size: 12px; color: #6E7684">{{countLabel}}</span>
</section>

<sc-if value="{{downloaded}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 999px; background: #F3F5F8; color: #0B0D10; font-size: 14px; font-weight: 700"><span style="flex: 1">Saved to Downloads · access-log.pdf</span></div>
</sc-if>
<button type="button" onClick="{{download}}" style="min-height: 52px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: #22262D; color: #F3F5F8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>Download log (PDF)</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const f = (this.state && this.state.f) || 'all';
const view = { icon: '◉', iconBg: '#22262D', iconColor: '#F3F5F8' };
const ok = { icon: '✓', iconBg: 'rgba(45,212,191,0.16)', iconColor: '#2DD4BF' };
const stop = { icon: '✕', iconBg: 'rgba(251,113,133,0.14)', iconColor: '#FB7185' };
const all = [
Object.assign({ type: 'views', who: 'Ravi Distributors', what: 'viewed your report', when: '22 Nov · 10:14' }, view),
Object.assign({ type: 'approvals', who: 'You', what: 'approved Ravi Distributors for 90 days', when: '22 Nov · 09:58' }, ok),
Object.assign({ type: 'views', who: 'Shree Traders', what: 'viewed your report', when: '20 Nov · 17:30' }, view),
Object.assign({ type: 'approvals', who: 'You', what: 'stopped sharing with Om Traders', when: '8 Nov · 12:02' }, stop),
Object.assign({ type: 'approvals', who: 'You', what: 'approved Mehta Wholesale for 30 days', when: '31 Oct · 16:45' }, ok),
Object.assign({ type: 'views', who: 'Mehta Wholesale', what: 'viewed your report', when: '31 Oct · 17:20' }, view)
];
const rows = f === 'all' ? all : all.filter(r => r.type === f);
const mk = (key, label) => {
const sel = f === key;
return { label: label, selected: sel ? 'true' : 'false', bg: sel ? '#F3F5F8' : '#22262D', color: sel ? '#0B0D10' : '#F3F5F8', border: sel ? 'none' : '1px solid rgba(255,255,255,0.08)', pick: () => this.setState({ f: key }) };
};
return {
tabs: [mk('all', 'All'), mk('views', 'Views'), mk('approvals', 'Approvals')],
rows: rows,
countLabel: rows.length + ' entries · last 30 days',
downloaded: !!(this.state && this.state.dl),
download: () => this.setState({ dl: true })
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
