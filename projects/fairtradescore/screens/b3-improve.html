<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How to improve</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 18px 24px; background: #0B0D10; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="{{backHref}}" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 999px; background: #22262D; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex: 1; font-size: 17px; font-weight: 800">{{pageTitle}}</span>
</div>

<section style="display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 24px; background: #171A1F; border: 1px solid rgba(167,139,250,0.40); box-shadow: 0 8px 32px rgba(167,139,250,0.22)">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C4B5FD">Your biggest lever</span>
<span style="font-size: 23px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">{{leverTitle}}</span>
<span style="font-size: 14px; line-height: 1.5; font-weight: 500; color: #A1A9B5">{{leverBody}} <b style="color: #F3F5F8">{{leverStrong}}</b></span>
<a href="{{leverHref}}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #A78BFA; box-shadow: 0 8px 28px rgba(167,139,250,0.35); color: #0B0D10; font-size: 15px; font-weight: 800; text-decoration: none">{{leverCta}}</a>
</section>

<section style="display: flex; flex-direction: column; padding: 4px 18px; border-radius: 24px; background: #171A1F; border: 1px solid rgba(255,255,255,0.06)">
<span style="font-size: 12px; font-weight: 700; color: #A1A9B5; padding: 12px 0 2px">{{listTitle}}</span>
<sc-for list="{{items}}" as="item" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 14px; min-height: 64px; border-bottom: 1px solid #22262D"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #A78BFA; flex: none"><span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 14px; font-weight: 700">{{item.title}}</span><span style="font-size: 12px; color: #A1A9B5">{{item.sub}}</span></span><span style="padding: 4px 10px; border-radius: 999px; background: {{item.tagBg}}; color: {{item.tagColor}}; font-size: 11px; font-weight: 800">{{item.tag}}</span></label>
</sc-for>
<label style="display: flex; align-items: center; gap: 14px; min-height: 64px"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #2DD4BF; flex: none"><span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 14px; font-weight: 700; color: #A1A9B5; text-decoration: line-through">Verify with DigiLocker</span><span style="font-size: 12px; color: #5EEAD4; font-weight: 600">Done · your business is verified</span></span></label>
</section>

<div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: #171A1F; font-size: 13px; line-height: 1.45; font-weight: 500; color: #A1A9B5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A9B5" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>{{footer}}</span></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","default":"established","options":["building","early","established"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const stage = this.props.stage ?? 'established';
const hi = { tagBg: 'rgba(167,139,250,0.18)', tagColor: '#C4B5FD', tag: 'High' };
const med = { tagBg: '#22262D', tagColor: '#A1A9B5', tag: 'Medium' };
const st = {
building: {
back: 'b0-building.html', page: 'Unlock your score',
title: 'Get a credit verified by a second supplier',
body: 'Your first score needs verified credits from at least 2 suppliers. Shree Traders can verify a past credit on WhatsApp in a minute.', strong: '',
cta: 'Add a past credit · 1 min', href: 'p2-add-past.html',
list: 'More ways to unlock your score',
items: [
{ title: 'Ask Ravi Distributors to record your next credit', sub: 'It counts once you confirm it', ...hi },
{ title: 'Share your profile with a new supplier', sub: 'A first credit from them counts too', ...med },
{ title: 'Add your GST returns', sub: 'Raises confidence once your score unlocks', ...med }
],
footer: 'Your first score unlocks at 3 verified credits from 2 suppliers over 60+ days.'
},
early: {
back: 'b0b-early.html', page: 'How to improve',
title: 'Add your GST returns',
body: 'Shows suppliers you file on time and narrows your range faster.', strong: '',
cta: 'Add GST returns · 2 min', href: 'b7-add-gst.html',
list: 'More ways to narrow your range',
items: [
{ title: 'Pay Ravi Distributors by 2 Dec', sub: '₹21,500 due · paying on time counts most', ...hi },
{ title: 'Add credits you’ve already paid', sub: 'Each verified credit gets you closer to established', ...med },
{ title: 'Link your second bank account', sub: 'Shows your full cash flow', ...med }
],
footer: 'Your range updates each time a supplier verifies a credit.'
},
established: {
back: 'b1-home.html', page: 'How to improve',
title: 'Add your GST returns',
body: 'Raises your confidence to High and shows you file on time. Estimated', strong: '+5 to +8 points.',
cta: 'Add GST returns · 2 min', href: 'b7-add-gst.html',
list: 'More ways to raise your score',
items: [
{ title: 'Pay Mehta Wholesale by 2 Dec', sub: 'Your last payment to them was late', ...hi },
{ title: 'Link your second bank account', sub: 'Shows your full cash flow', ...med },
{ title: 'Avoid cheque or ECS bounces', sub: 'None in 6 months · keep it up', ...med }
],
footer: 'Your score updates once a month. Next update: 1 Dec.'
}
}[stage] || {};
return {
backHref: st.back, pageTitle: st.page, leverTitle: st.title, leverBody: st.body, leverStrong: st.strong,
leverCta: st.cta, leverHref: st.href, listTitle: st.list, items: st.items || [], footer: st.footer
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
