<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stop sharing</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #050608; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 28px; display: flex; flex-direction: column; gap: 14px; opacity: 0.28"><span style="font-size: 28px; font-weight: 800">Trust &amp; privacy</span><div style="height: 76px; border-radius: 24px; background: #171A1F"></div><div style="height: 160px; border-radius: 24px; background: #171A1F"></div></div>

<sc-if value="{{stopped}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; top: 330px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 999px; background: #F3F5F8; color: #0B0D10; font-size: 14px; font-weight: 700"><span style="flex: 1">Access stopped for Shree Traders</span><button type="button" onClick="{{undo}}" style="min-height: 36px; border: none; background: transparent; color: #6247D9; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 800">Undo</button></div>
</sc-if>

<div role="dialog" aria-label="Stop sharing with Shree Traders" style="position: relative; background: #171A1F; border-top: 1px solid rgba(255,255,255,0.08); box-shadow: 0 -20px 50px rgba(0,0,0,0.6); border-radius: 32px 32px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3A3F48"></span>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 999px; background: #2A2F37; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">ST</span><div style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Shree Traders</span><span style="font-size: 12px; color: #A1A9B5">Access until 3 Jan 2027 · viewed 2 times</span></div></div>
<span style="font-size: 23px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">{{title}}</span>
<span style="font-size: 14px; line-height: 1.55; color: #A1A9B5">{{body}}</span>
<sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<button type="button" onClick="{{stop}}" style="width: 100%; min-height: 56px; border: none; border-radius: 999px; background: #FB7185; color: #0B0D10; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 800">Stop sharing</button>
<a href="c1-trust.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #F3F5F8; font-size: 15px; font-weight: 700; text-decoration: none">Keep sharing</a>
</div>
</sc-if>
<sc-if value="{{stopped}}" hint-placeholder-val="{{ false }}">
<a href="c1-trust.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: #A78BFA; color: #0B0D10; font-size: 16px; font-weight: 800; text-decoration: none">Done</a>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = !!(this.state && this.state.stopped);
return {
asking: !s, stopped: s,
title: s ? 'Shree Traders can no longer see your score' : 'Stop sharing with Shree Traders?',
body: s ? 'We’ve told them. They can send a new request if they need it, and you decide again.' : 'They lose access right away. They’ll be told, and can ask again later.',
stop: () => this.setState({ stopped: true }),
undo: () => this.setState({ stopped: false })
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
