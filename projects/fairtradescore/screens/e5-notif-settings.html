<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}x-dc{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 18px 24px; background: #0B0D10; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5F8; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="e1-account.html" aria-label="Back to Account" style="width: 44px; height: 44px; border-radius: 999px; background: #22262D; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex: 1; font-size: 17px; font-weight: 800">Notifications</span>
</div>

<span style="font-size: 13px; font-weight: 700; color: #A1A9B5; margin-top: 4px">Tell me when</span>
<div style="display: flex; flex-direction: column; padding: 4px 16px; border-radius: 20px; background: #171A1F">
<sc-for list="{{items}}" as="i" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #22262D">
<span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 15px; font-weight: 700">{{i.label}}</span><span style="font-size: 12px; color: #A1A9B5">{{i.sub}}</span></span>
<button type="button" role="switch" aria-checked="{{i.checked}}" aria-label="{{i.label}}" onClick="{{i.toggle}}" style="width: 52px; height: 32px; flex: none; border: none; border-radius: 999px; background: {{i.track}}; padding: 3px; display: flex; justify-content: {{i.justify}}; opacity: {{i.opacity}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: {{i.knob}}"></span></button>
</div>
</sc-for>
</div>

<span style="font-size: 13px; font-weight: 700; color: #A1A9B5; margin-top: 4px">Send them by</span>
<div style="display: flex; flex-direction: column; padding: 4px 16px; border-radius: 20px; background: #171A1F">
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #22262D; font-size: 15px; font-weight: 700"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #A78BFA">App notification</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #22262D; font-size: 15px; font-weight: 700"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #A78BFA">WhatsApp</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; font-size: 15px; font-weight: 700"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #A78BFA">SMS</label>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = Object.assign({ change: true, expiry: true, pay: true, tips: false }, this.state || {});
const defs = [
['req', 'Someone asks to see my score', 'Always on, because your consent is needed', true, true],
['change', 'My score changes', 'Once a month, with the reason', s.change, false],
['expiry', 'Access is about to end', '7 days before', s.expiry, false],
['pay', 'A supplier reports a payment', 'So you can dispute it quickly', s.pay, false],
['tips', 'Tips to improve', 'At most twice a month', s.tips, false]
];
return {
items: defs.map(d => {
const on = d[3];
const locked = d[4];
return {
label: d[1], sub: d[2],
checked: on ? 'true' : 'false',
track: on ? '#A78BFA' : '#2A2F37',
knob: on ? '#0B0D10' : '#A1A9B5',
justify: on ? 'flex-end' : 'flex-start',
opacity: locked ? '0.55' : '1',
toggle: () => { if (!locked) { const n = {}; n[d[0]] = !on; this.setState(n); } }
};
})
};
}
}
</script>
<script src="dc-lite.js?v=4"></script>
</body>
</html>
